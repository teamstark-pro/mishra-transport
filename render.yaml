services:
  - type: web
    name: mishra-transport-backend
    env: python
    region: sfo
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn vehicle_api:app --bind 0.0.0.0:${PORT}
    envVars:
      - key: FLASK_ENV
        value: production
      - key: CACHE_FILE
        value: /tmp/vehicle_cache.json
      - key: VEHICLE_API_URL
        sync: false  # set in the dashboard: URL of the vehicle_api project on Vercel (Mumbai)
      - key: MONGODB_URI
        sync: false  # optional: MongoDB Atlas connection string for a persistent cache
      - key: MONGODB_DB
        value: mishra_transport
